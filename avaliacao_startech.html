<!DOCTYPE html>

<html lang="pt-BR">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1" name="viewport"/>
<title>Avaliação StarTech (Demo v3)</title>
<style>
    :root {
      --bg0:#07080b; --bg1:#0b0c10;
      --text:#e9ecf5; --muted:#a8adbb; --line:rgba(255,255,255,.10);
      --good:#18a957; --bad:#ff4d4d; --accent:#ffffff; --accentText:#0b0c10;
    }
    *{box-sizing:border-box}
    body{margin:0;background:#000000;
         color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
    .wrap{max-width:1020px;margin:26px auto;padding:0 16px}
    h1{font-size:22px;margin:0 0 6px;letter-spacing:-.01em}
    .sub{color:var(--muted);font-size:13px;margin:0 0 18px;line-height:1.35}
    .grid{display:grid;grid-template-columns:1.25fr .75fr;gap:14px}
    @media (max-width: 860px){.grid{grid-template-columns:1fr}}
    .card{background:rgba(17,19,26,.92);border:1px solid var(--line);border-radius:18px;padding:16px;
           box-shadow:0 12px 40px rgba(0,0,0,.25)}
    .titleRow{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}
    .badge{padding:6px 10px;border-radius:999px;font-weight:900;font-size:12px;border:1px solid var(--line)}
    .ok{color:var(--good);border-color:rgba(24,169,87,.35);background:rgba(24,169,87,.08)}
    .no{color:var(--bad);border-color:rgba(255,77,77,.35);background:rgba(255,77,77,.08)}
    label{display:block;font-weight:900;margin:12px 0 8px;font-size:13px}
    select,input[type="number"]{width:100%;padding:12px 12px;border-radius:14px;border:1px solid var(--line);
      background:rgba(255,255,255,.04);color:var(--text);outline:none}
    select{appearance:none;background-image:linear-gradient(45deg, transparent 50%, rgba(255,255,255,.55) 50%),
                               linear-gradient(135deg, rgba(255,255,255,.55) 50%, transparent 50%);
           background-position: calc(100% - 18px) calc(50% - 3px), calc(100% - 13px) calc(50% - 3px);
           background-size:5px 5px, 5px 5px; background-repeat:no-repeat; padding-right:34px}
    select option{background:#0f1117;color:var(--text)}
    .step{border:1px solid var(--line);background:rgba(255,255,255,.02);border-radius:16px;padding:14px;margin-top:12px}
    .stepHead{display:flex;justify-content:space-between;align-items:center;gap:10px}
    .stepNum{width:26px;height:26px;border-radius:10px;background:rgba(255,255,255,.07);
              display:flex;align-items:center;justify-content:center;font-weight:950}
    .stepName{font-weight:950}
    .hint{color:var(--muted);font-size:12px;margin-top:8px;line-height:1.35}
    .row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    @media (max-width: 540px){.row{grid-template-columns:1fr}}
    .toggle{display:flex;gap:10px;align-items:flex-start;padding:10px;border:1px solid var(--line);
      border-radius:14px;background:rgba(255,255,255,.02)}
    .toggle input{width:auto;margin-top:2px}
    .chips{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
    @media (max-width: 640px){.chips{grid-template-columns:1fr}}
    .chip{display:flex;gap:10px;align-items:center;padding:10px;border:1px solid var(--line);
      border-radius:14px;background:rgba(255,255,255,.02);cursor:pointer;user-select:none}
    .chip input{width:auto}
    .btn{width:100%;padding:13px 14px;border-radius:14px;border:0;cursor:pointer;
      font-weight:950;background:var(--accent);color:var(--accentText);margin-top:14px}
    .btn2{width:100%;padding:12px 14px;border-radius:14px;border:1px solid var(--line);cursor:pointer;
      font-weight:900;background:rgba(255,255,255,.03);color:var(--text);margin-top:10px}
    .money{font-size:30px;font-weight:1000;letter-spacing:-.02em}
    table{width:100%;border-collapse:collapse;margin-top:12px}
    td{padding:10px 6px;border-bottom:1px solid var(--line);font-size:13px}
    td.r{text-align:right;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
    .warn{color:var(--bad);font-weight:950}
    .hidden{display:none !important}
    .successToast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);
      background:rgba(17,19,26,.95);border:1px solid var(--line);padding:10px 12px;border-radius:14px;
      color:var(--text);font-weight:900;box-shadow:0 10px 30px rgba(0,0,0,.35);display:none}
  
/* Apple-like typography */
html, body{
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text",
               system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

/* Cards a bit more iOS-like */
.card{
  border-radius:20px !important;
  border:1px solid rgba(255,255,255,0.10) !important;
  background:rgba(255,255,255,0.04) !important;
  box-shadow:0 12px 30px rgba(0,0,0,0.45) !important;
}

/* Inputs style similar to iOS */
select, input[type="number"], input[type="text"]{
  border-radius:14px !important;
  border:1px solid rgba(255,255,255,0.16) !important;
  background:rgba(255,255,255,0.05) !important;
  height:42px !important;
}

select:focus, input:focus{
  border-color:#0A84FF !important;
  box-shadow:0 0 0 3px rgba(10,132,255,0.25) !important;
}

/* Buttons more Apple-like */
button, .btn{
  border-radius:16px !important;
  font-weight:600 !important;
  letter-spacing:0.2px;
  box-shadow:
    0 6px 16px rgba(0,0,0,0.45),
    inset 0 1px 0 rgba(255,255,255,0.15);
}

button:hover, .btn:hover{
  transform:translateY(-1px);
  box-shadow:
    0 10px 24px rgba(0,0,0,0.55),
    inset 0 1px 0 rgba(255,255,255,0.20);
}


/* Make step 5 visually part of step 4 (remove card look) */
#q5{
  margin-top:8px;
}
#q5 .stepHead{
  margin-top:6px;
}
#q5{
  border-top:1px solid rgba(255,255,255,0.08);
  padding-top:12px;
}

</style>
</head>

  let lastResult = null;

  function brl(n){ const v = Number(n||0); return v.toLocaleString('pt-BR'); }
  function num(v){
    if(v===null||v===undefined||v==="") return 0;
    if(typeof v === "number") return v;
    const s = String(v).replace(",",".").trim();
    const f = Number(s);
    return isNaN(f) ? 0 : f;
  }
  function signedByColor(color, value){
    const v = Math.abs(num(value));
    const c = (color||"").toUpperCase();
    if(c === "#F4CCCC") return -v;
    if(c === "#D9EAD3") return v;
    return num(value);
  }
  function baseByBattery(modelObj, battery){
    if(battery >= 88) return {name:"Bat 88>100", value:modelObj.bat_88_100};
    if(battery >= 82) return {name:"Bat 82>87", value:modelObj.bat_82_87};
    // Abaixo de 82%: considerar como Manutenção
    return {name:"Bat 82>Man", value:modelObj.bat_79_81};
  }
  function selectedDefects(){
    return Array.from(document.querySelectorAll('#itens input[type="checkbox"]:checked')).map(x => x.value);
  }
  function toggleCalcButton(){
    const on = true;
    document.getElementById("btnCalc").style.display = on ? "none" : "block";
  }
  function maybeAutoCalc(){
    const batteryRaw = (document.getElementById("bateria")?.value ?? "").toString().trim();
    const estado = document.getElementById("estado")?.value ?? "";
    if(!batteryRaw || !estado) return;
    calc();
  }

  function revealUpTo(stepId){
    const order = ["q2","q3","q4","q5"];
    for(const id of order){ document.getElementById(id).classList.add("hidden"); }
    const idx = order.indexOf(stepId);
    for(let i=0;i<=idx;i++){ document.getElementById(order[i]).classList.remove("hidden"); }
  }

  function init(){
    const sel = document.getElementById("modelo");
    sel.innerHTML = DATA.models.map(m => `<option value="${m}">${m}</option>`).join("");

    const wrap = document.getElementById("itens");
    wrap.innerHTML = DATA.items.map(i => `
      <label class="chip">
        <input type="checkbox" value="${i}" />
        <div style="font-weight:900">${i}</div>
      </label>
    `).join("");

    sel.addEventListener("change", () => { revealUpTo("q2"); maybeAutoCalc(); });

    const bat = document.getElementById("bateria");
    bat.addEventListener("input", () => { revealUpTo("q3"); maybeAutoCalc(); });
    bat.addEventListener("change", () => { revealUpTo("q3"); maybeAutoCalc(); });

    document.getElementById("estado").addEventListener("change", () => { revealUpTo("q5"); maybeAutoCalc(); });

    ["comprado","garantia"].forEach(id => {
      document.getElementById(id).addEventListener("change", () => { revealUpTo("q5"); maybeAutoCalc(); });
    });

    wrap.addEventListener("change", () => { revealUpTo("q5"); maybeAutoCalc(); });

    document.getElementById("autoCalc").addEventListener("change", () => { toggleCalcButton(); maybeAutoCalc(); });

    
    document.getElementById("btnCopy").addEventListener("click", () => copyText());
    document.getElementById("btnWA").addEventListener("click", () => openWA());

    toggleCalcButton();

    document.getElementById("btnReset").addEventListener("click", (e) => { e.preventDefault(); e.stopPropagation(); resetAll(); });

  }

  function calc(){
    const modelo = document.getElementById("modelo").value;
    const batteryRaw = (document.getElementById("bateria")?.value ?? "").toString().trim();
    const battery = num(batteryRaw);
    const estado = document.getElementById("estado")?.value ?? "";
    const comprado = document.getElementById("comprado")?.checked ?? false;
    const garantia = document.getElementById("garantia")?.checked ?? false;
    const selected = selectedDefects();

    const modelObj = DATA.lookup[modelo];
    if(!modelObj) return;

    // Só mostrar/gerar valor após: Modelo + Bateria + Condição
    if(!batteryRaw || !estado){
      const money = document.getElementById("money");
      const pill = document.getElementById("pill");
      const motivo = document.getElementById("motivo");
      const tb = document.getElementById("breakdown");
      money.textContent = "—";
      pill.textContent = "—";
      pill.className = "badge";
      motivo.textContent = "";
      tb.innerHTML = "";
      return;
    }

    const breakdown = [];
    const base = baseByBattery(modelObj, battery);
    let total = num(base.value);
    breakdown.push([`Base (${base.name})`, total]);

    const st = modelObj.adjustments[estado];
    const stAdj = signedByColor(st?.color, st?.value);
    total += stAdj;
    breakdown.push([`Condição (${estado})`, stAdj]);

    if(garantia){
      const ga = modelObj.adjustments["Garantia Apple"];
      const adj = signedByColor(ga?.color, ga?.value);
      total += adj;
      breakdown.push(["Adicional: Garantia Apple", adj]);
    }
    if(comprado){
      const sc = modelObj.adjustments["Startech"];
      const adj = signedByColor(sc?.color, sc?.value);
      total += adj;
      breakdown.push(["Adicional: Comprado na StarTech", adj]);
    }

    const recusas = [];
    for(const nome of selected){
      const it = modelObj.items[nome];
      const v = it?.value;

      if(String(v||"").trim().toUpperCase() === "X"){
        recusas.push(nome);
        continue;
      }
      const adj = signedByColor(it?.color, v);
      total += adj;
      breakdown.push([nome, adj]);
    }

    if(recusas.length){
      render(false, null, `Troca recusada por: ${recusas.join(", ")}.`, breakdown, {modelo,battery,estado,comprado,garantia,selected});
      return;
    }

    if(total < 0) total = 0;
    render(true, Math.round(total), "", breakdown, {modelo,battery,estado,comprado,garantia,selected});
  }

  function render(aprovado, valor, motivo, breakdown, ctx){
    const money = document.getElementById("money");
    const pill = document.getElementById("pill");
    const m = document.getElementById("motivo");
    const tb = document.getElementById("breakdown");

    if(!aprovado){
      money.textContent = "";
      pill.textContent = "❌ REPROVADO";
      pill.className = "badge no";
      m.textContent = motivo || "";
    } else {
      money.textContent = `R$ ${brl(valor)}`;
      pill.textContent = "APROVADO";
      pill.className = "badge ok";
      m.textContent = "";
    }

    tb.innerHTML = breakdown.map(([k,v]) => `
      <tr>
        <td>${k}</td>
        <td class="r">${(Number(v)>=0?"+":"")}${brl(v)}</td>
      </tr>
    `).join("");

    lastResult = {aprovado, valor, motivo, breakdown, ctx};
    document.getElementById("btnCopy").classList.remove("hidden");
    document.getElementById("btnWA").classList.remove("hidden");
  }

  function buildShareText(){
    if(!lastResult) return "";
    const c = lastResult.ctx || {};
    const lines = [];
    lines.push("Avaliação StarTech");
    lines.push("");
    lines.push(`Modelo: ${c.modelo}`);
    lines.push(`Bateria: ${c.battery}%`);
    lines.push(`Condição: ${c.estado}`);
    if(c.comprado) lines.push("Comprado conosco: Sim");
    if(c.garantia) lines.push("Garantia Apple: Sim");
    if((c.selected||[]).length) lines.push(`Defeitos/Condições: ${(c.selected||[]).join(", ")}`);
    lines.push("");
    if(!lastResult.aprovado){
      lines.push("Resultado: REPROVADO");
      if(lastResult.motivo) lines.push(lastResult.motivo);
    } else {
      lines.push(`Valor final de troca: R$ ${brl(lastResult.valor)}`);
    }
    return lines.join("\n");
  }

  async function copyText(){
    const text = buildShareText();
    try { await navigator.clipboard.writeText(text); toast("Copiado ✅"); }
    catch(e){
      const ta = document.createElement("textarea");
      ta.value = text; document.body.appendChild(ta);
      ta.select(); document.execCommand("copy");
      document.body.removeChild(ta);
      toast("Copiado ✅");
    }
  }

  function openWA(){
    const text = encodeURIComponent(buildShareText());
    window.open(`https://wa.me/?text=${text}`, "_blank");
  }

  function toast(msg){
    const t = document.getElementById("toast");
    t.textContent = msg;
    t.style.display = "block";
    clearTimeout(window.__toastTimer);
    window.__toastTimer = setTimeout(() => t.style.display = "none", 1600);
  }

  function resetAll(){
  try{
    // reset inputs
    const modelo = document.getElementById("modelo");
    const bateria = document.getElementById("bateria");
    const estado = document.getElementById("estado");
    const comprado = document.getElementById("comprado");
    const garantia = document.getElementById("garantia");

    if(modelo){ modelo.selectedIndex = 0; }
    if(bateria){ bateria.value = ""; }
    if(estado){ estado.value = ""; }

    if(comprado) comprado.checked = false;
    if(garantia) garantia.checked = false;

    // uncheck defects
    document.querySelectorAll('#itens input[type="checkbox"]').forEach(cb => cb.checked = false);

    // hide steps 2-5
    ["q2","q3","q4","q5"].forEach(id => document.getElementById(id).classList.add("hidden"));

    // reset result
    const money = document.getElementById("money");
    const pill = document.getElementById("pill");
    const motivo = document.getElementById("motivo");
    const tb = document.getElementById("breakdown");
    if(money) money.textContent = "—";
    if(pill){ pill.textContent = "—"; pill.className = "badge"; }
    if(motivo) motivo.textContent = "";
    if(tb) tb.innerHTML = "";

    // optional: scroll top
    window.scrollTo({top:0, behavior:"smooth"});
  }catch(err){ console.error("Reset error:", err); }
}

  init();
</script>
